name: Auto deploy Docker Hub images to AWS EC2

on:
  workflow_run: # Only trigger this workflow if these workflows are completed & success
    workflows:
      [
        "Build & Push AuthService image to Docker Hub",
        "Build & Push EmployeeService image to Docker Hub",
      ]
    types:
      - completed

jobs:
  auto-deploy-dockerhub-images-ec2:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3      
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY_URL }}

      - name: Pull Docker Hub images
        run: |
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/authservice:latest
          sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:latest

      - name: Stop & remove running docker containers
        run: |
          sudo docker stop authservice || true
          sudo docker stop employeeservice || true
          sudo docker rm authservice || true
          sudo docker rm employeeservice || true

      - name: Start new docker containers
        run: |
          sudo docker run -d \
            --name authservice \
            --env-file ~/EmployeeManagement/AuthService/.env \
            -p 5000:8080 \
            ${{ secrets.DOCKERHUB_USERNAME }}/authservice:latest 

          sudo docker run -d \
            --name employeeservice \
            --env-file ~/EmployeeManagement/EmployeeService/.env \
            -p 5001:8080 \
            ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:latest
