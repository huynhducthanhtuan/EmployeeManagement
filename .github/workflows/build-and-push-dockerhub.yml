name: Build and Push Docker Images To Docker Hub

on:
  push:
    branches:
      - develop

jobs:
  build-and-push-dockerhub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push AuthService
        uses: docker/build-push-action@v5
        with:
          context: ./AuthService
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/authservice:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/authservice:${{ github.sha }}

      - name: Build & Push EmployeeService
        uses: docker/build-push-action@v5
        with:
          context: ./EmployeeService
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:${{ github.sha }}
