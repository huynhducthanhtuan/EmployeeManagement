name: Build and Push Docker Images To Docker Hub

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "README.md"

jobs:
  build-and-push-dockerhub:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      GITHUB_SHA: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_TOKEN

      - name: Build & Push AuthService
        uses: docker/build-push-action@v5
        with:
          context: ./AuthService
          push: true
          tags: |
            $DOCKERHUB_USERNAME/authservice:latest
            $DOCKERHUB_USERNAME/authservice:$GITHUB_SHA

      - name: Build & Push EmployeeService
        uses: docker/build-push-action@v5
        with:
          context: ./EmployeeService
          push: true
          tags: |
            $DOCKERHUB_USERNAME/employeeservice:latest
            $DOCKERHUB_USERNAME/employeeservice:$GITHUB_SHA
