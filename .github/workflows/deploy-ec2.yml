name: Deploy services on AWS EC2

on:
  workflow_run: # Only trigger this workflow if these 3 workflows are completed & success
    workflows:
      [
        "Build & Push AuthService image to Docker Hub",
        "Build & Push EmployeeService image to Docker Hub",
        "Build & Push InfraCore commons to Nuget.org",
      ]
    types:
      - completed

jobs:
  deploy-ec2:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Pull Docker Hub images
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/authservice:latest
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:latest

      - name: Stop & remove running docker containers
        run: |
          docker stop authservice
          docker stop employeeservice
          docker rm authservice
          docker rm employeeservice

      - name: Start new docker containers
        run: |
          docker run -d --name authservice -p 5000:8080 ${{ secrets.DOCKERHUB_USERNAME }}/authservice:latest 
          docker run -d --name employeeservice -p 5001:8080 ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:latest
