name: Build & Push AuthService image to AWS ECR repository

on:
  push:
    branches:
      - develop
    paths:
      - "AuthService/**"

jobs:
  publish-authservice-aws-ecr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AuthService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip curl
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY_URL }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.ECR_REGISTRY_URL }}/ems/authservice:latest .

      - name: Push image to AWS ECR repository
        run: docker push ${{ secrets.ECR_REGISTRY_URL }}/ems/authservice:latest
