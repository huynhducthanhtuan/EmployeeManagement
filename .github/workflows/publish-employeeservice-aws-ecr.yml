name: Build & Push EmployeeService image to AWS ECR repository

on:
  push:
    branches:
      - develop
    paths:
      - "EmployeeService/**"

jobs:
  publish-employeeservice-aws-ecr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmployeeService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to AWS ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
            | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY_URL }}

      - name: Build Docker image
        run: |
          sudo docker build -t ${{ secrets.ECR_REGISTRY_URL }}/ems/employeeservice:latest . \
                            -t ${{ secrets.ECR_REGISTRY_URL }}/ems/employeeservice:${{ github.sha }}

      - name: Push image to AWS ECR repository
        run: |
          sudo docker push ${{ secrets.ECR_REGISTRY_URL }}/ems/employeeservice:latest
          sudo docker push ${{ secrets.ECR_REGISTRY_URL }}/ems/employeeservice:${{ github.sha }}
