name: Build & Push EmployeeService iamge to Docker Hub

on:
  push:
    branches:
      - develop
    paths:
      - "EmployeeService/**"

jobs:
  build-and-push-dockerhub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EmployeeService

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push EmployeeService
        uses: docker/build-push-action@v5
        with:
          context: ./EmployeeService
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/employeeservice:${{ github.sha }}
