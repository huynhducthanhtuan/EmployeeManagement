version: "3"

services:
  authservice:
    image: hdthanhtuan/authservice:latest
    container_name: authservice
    env_file:
      - ./AuthService/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5000:8080"

  employeeservice:
    image: hdthanhtuan/employeeservice:latest
    container_name: employeeservice
    env_file:
      - ./EmployeeService/.env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5001:8080"
